
name: mamacare-docker-image

on:
  workflow_dispatch:
  push:
    branches:
      - "main" # Change to the branch name you are targeting

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nebo-techn/mamacare-ai # takes the name of the repository. 

jobs:

  build-publish-deploy:
    name: build and push docker
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:

    - name: checkout
      uses: actions/checkout@v3

    - name: Set up Docker Builds
      uses: docker/setup-buildx-action@v2

    - name: Login to Container registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@69f6fc9d46f2f8bf0d5491e4aabe0bb8c6a4678a
      with:
        images: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=tag
          type=ref,event=pr
          type=sha
        flavor: |
          latest=auto
          prefix=
          suffix=

    - name: Build and push BASE image
      uses: docker/build-push-action@v5 # Using v5 for latest features
      with:
        context: .
        file: ./docker/Dockerfile.base
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:base-latest
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:base-latest
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:base-${{ github.sha }}
        cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-base
        cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-base,mode=max
    
    - name: Build and push BACKEND image
      uses: docker/build-push-action@v2
      with:
        context: .
        file: ./docker/Dockerfile.backend
        push: true
        tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:backend-${{ steps.meta.outputs.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:backend-latest 
        cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:backend-latest
        cache-to: type=inline

    - name: Build and push UI image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/Dockerfile.ui
        push: true
        tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ui-${{ steps.meta.outputs.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ui-latest 
        cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ui-latest
        cache-to: type=inline

