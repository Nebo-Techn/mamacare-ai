version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: rag_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mamacare
    ports:
      -"5432:5432"
    volumes:
      -postgres_data:/var/lib/postgresql/data
    networks:
      - rag_network

  ingestion_service:
    build: .
    container_name: rag_ingestion
    depends_on:
      - postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mamacare
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    volumes:
      - ./data:/app/data
    networks:
      - rag_network

volumes:
  postgres_data:

networks:
  rag_network:
    driver: bridge