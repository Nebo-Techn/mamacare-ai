version: '3.8'

services:
  postgres:
    image: ankane/pgvector:latest
    container_name: afyamama_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mamacare
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - afyamama_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: afyamama_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - afyamama_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: mamacare_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8001:8000"
    volumes:
      - ./data:/app/data
      - ./scraped_content:/app/scraped_content
      - ./facebook_posts:/app/facebook_posts
      - ./faiss_local:/app/faiss_local
    networks:
      - afyamama_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: ["/app/docker/start-backend.sh"]
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: mamacare_worker
    restart: always
    depends_on:
      - backend
      - redis
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./scraped_content:/app/scraped_content
      - ./facebook_posts:/app/facebook_posts
    networks:
      - mamacare_network
    command: celery -A pipeline.tasks worker --loglevel=info

  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui
    container_name: mamacare_ui
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8501:8501"
    volumes:
      - ./ui:/app/ui
    networks:
      - mamacare_network

volumes:
  postgres_data:
  redis_data:

networks:
  mamacare_network:
    driver: bridge